[project]
name = "ossl-test-tools"
version = "0.1.0"
description = "Python helpers for OpenSSL test artifacts and tooling"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "cryptography>=48",
]

[project.scripts]
ossl-test-tools = "ossl_test_tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ossl_test_tools"]
